name: link_note
description: "Share and sync text easily between your devices using QR codes or clipboard.."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.1.2
  path: ^1.9.1
  pretty_qr_code: ^3.5.0
  scanner_overlay: ^0.0.2
  supabase_flutter: ^2.12.0
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  internet_connection_checker_plus: ^2.9.1
  flutter_riverpod: ^3.0.3
  shared_preferences: ^2.5.3
  get_it: ^9.2.0
  skeletonizer: ^2.1.1
  app_links: ^6.4.1
  protocol_handler: ^0.2.0
  sqflite_common_ffi: ^2.4.0+1
  uuid: ^4.5.2
  http: ^1.6.0
  flutter_svg: ^2.2.3
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  rename: ^3.1.0
  # msix: ^2.7.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - shorebird.yaml

# msix_config:
#   display_name: Link Note
#   publisher_display_name: Bofaisal
#   identity_name: www.bhf.com
#   msix_version: 1.0.0.0
#   logo_path: E:\Projects\Link Note\link_note\assets\images\app_logo.png

flutter_assets:
  assets_path: assets/
  output_path: lib/core/constants/assets/
  filename: app_assets.dart
  field_prefix:
  ignore_comments: true