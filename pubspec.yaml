name: link_note
description: "Share and sync text easily between your devices using QR codes or clipboard.."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bluetooth_enable_fork:
    git:
      url: https://github.com/MohammedBazhair/bluetooth_enable_fork.git
      ref: 7eeaa427cc913f9a28b0be20fc704b56ce14ebfd
  mobile_scanner: ^7.1.2
  path: ^1.9.1
  pretty_qr_code: ^3.5.0
  supabase_flutter: ^2.12.0
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  flutter_riverpod: ^3.0.3
  skeletonizer: ^2.1.1
  app_links: ^6.4.1
  protocol_handler: ^0.2.0
  sqflite_common_ffi: ^2.4.0+1
  uuid: ^4.5.2
  http: ^1.6.0
  flutter_svg: ^2.2.3
  flutter_cache_manager: ^3.4.1
  onesignal_flutter: ^5.3.5
  image_gallery_saver_plus: ^4.0.1
  nearby_connections: ^4.3.0
  location: ^8.0.1
  device_info_plus: ^11.3.0
  audioplayers: ^6.5.1
  record: ^6.2.0
  audio_waveforms: ^2.0.2
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  equatable: ^2.0.8
  internet_connection_checker_plus: ^3.0.0
  mocktail: ^1.0.5
  flutter_secure_storage: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  rename: ^3.1.0
  # msix: ^2.7.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/fonts/
    - shorebird.yaml

  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

# msix_config:
#   display_name: Link Note
#   publisher_display_name: Bofaisal
#   identity_name: www.bhf.com
#   msix_version: 1.0.0.0
#   logo_path: E:\Projects\Link Note\link_note\assets\images\app_logo.png

flutter_assets:
  assets_path: assets/
  output_path: lib/core/constants/assets/
  filename: app_assets.dart
  field_prefix:
  ignore_comments: true